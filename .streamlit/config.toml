# Streamlit paints its own widgets from these two palettes: the app starts in
# the theme the viewer's operating system asks for, and the ⋮ menu can flip it.
# The sidebar switch in app/ui.py can force the other palette on top of that.
[theme.light]
primaryColor = "#1f4e79"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f3f5f8"
textColor = "#1f2328"

[theme.dark]
primaryColor = "#4f9cf0"
backgroundColor = "#0d1117"
secondaryBackgroundColor = "#161b22"
textColor = "#e6edf3"

[server]
maxUploadSize = 2
headless = true

[browser]
gatherUsageStats = false
